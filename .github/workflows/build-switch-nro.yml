name: Build Switch NRO

on:
  push:
    branches: [main]
    paths:
      - "wireless-sync-hub/nro-v2/**"
      - ".github/workflows/build-switch-nro.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build NRO
        id: nro_build
        working-directory: wireless-sync-hub/nro-v2
        run: make 2>&1 | tee build.log

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: NX-Save-Sync-Hub-NRO
          path: wireless-sync-hub/nro-v2/SwitchSaveSyncHub.nro

      - name: Download built NRO
        uses: actions/download-artifact@v4
        with:
          name: NX-Save-Sync-Hub-NRO
          path: built-nro

      - name: Publish NRO release via API
        if: github.event_name == 'push'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'built-nro/SwitchSaveSyncHub.nro';
            const content = fs.readFileSync(path);
            const release = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: `nro-${context.runNumber}`,
              name: `Switch NRO build ${context.runNumber}`,
              prerelease: true,
            });
            await github.rest.repos.uploadReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.data.id,
              name: 'SwitchSaveSyncHub.nro',
              data: content,
              headers: {
                'content-type': 'application/octet-stream',
                'content-length': content.length,
              },
            });

      - name: Open CI failure issue
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logPath = 'wireless-sync-hub/nro-v2/build.log';
            const log = fs.existsSync(logPath)
              ? fs.readFileSync(logPath, 'utf8')
              : 'Build log was not captured.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI failure log ${context.runNumber}`,
              body: log.slice(-60000),
            });
