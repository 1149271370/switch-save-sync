name: Build Switch NRO

on:
  push:
    branches: [main]
    paths:
      - "wireless-sync-hub/nro-v2/**"
      - ".github/workflows/build-switch-nro.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build NRO
        id: nro_build
        working-directory: wireless-sync-hub/nro-v2
        run: make 2>&1 | tee build.log

      - name: Open CI failure issue with build log
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const logPath = 'wireless-sync-hub/nro-v2/build.log';
            const log = fs.existsSync(logPath)
              ? fs.readFileSync(logPath, 'utf8')
              : 'Build log was not captured.';
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `CI build log ${context.runNumber}`,
              body: log.slice(-60000),
            });

      - name: Upload NRO artifact
        uses: actions/upload-artifact@v4
        with:
          name: NX-Save-Sync-Hub-NRO
          path: wireless-sync-hub/nro-v2/SwitchSaveSyncHub.nro

      - name: Attach NRO to nightly release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'push'
        with:
          tag_name: nro-${{ github.run_number }}
          name: Switch NRO build ${{ github.run_number }}
          draft: false
          prerelease: true
          files: wireless-sync-hub/nro-v2/SwitchSaveSyncHub.nro
